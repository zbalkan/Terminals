name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source/Terminals.sln

jobs:
  build:
    # Windows Server 2019 hosted runners were retired in June 2025.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v3
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v1.1
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.1.1
      - name: Restore Packages
        run: nuget restore ${{ env.SLN_FILE_PATH }}
      - name: Provision .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'net40-reference'
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -Source https://api.nuget.org/v3/index.json -OutputDirectory $packageDir -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet could not retrieve .NET Framework 4.0 reference assemblies' }
          $source = Join-Path $packageDir 'Microsoft.NETFramework.ReferenceAssemblies.net40/build/.NETFramework/v4.0'
          $destination = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.0'
          if (-not (Test-Path (Join-Path $source 'mscorlib.dll'))) { throw 'Downloaded net40 reference assemblies are incomplete' }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force
          if (-not (Test-Path (Join-Path $destination 'mscorlib.dll'))) { throw 'Failed to provision net40 reference assemblies' }
      - name: Enforce EF6-only database API references
        shell: pwsh
        run: |
          $patterns = 'System\.Data\.Objects', 'System\.Data\.EntityClient', 'EntityFramework\.5\.0\.0', 'EntityFramework, Version=4\.4\.0\.0'
          $paths = @('Source/Terminals/Data/DB', 'Source/Terminals/Terminals.csproj', 'Source/Terminals/packages.config', 'Source/Terminals/app.config', 'Source/Tests/Tests.csproj', 'Source/Tests/packages.config', 'Source/Tests/App.config', 'Source/Tests/Terminals.exe.config')
          $files = Get-ChildItem $paths -File -Recurse | Where-Object { $_.Extension -in '.cs', '.tt', '.config', '.csproj' }
          $violations = $files | Select-String -Pattern $patterns
          if ($violations) { $violations | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line)" }; exit 1 }
      - name: Build solution
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:rebuild -property:Configuration=Release
      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.2
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v1.7
        with:
          install: localdb
          show-log: true
      - name: Test
        run: vstest.console.exe /logger:"trx;LogFileName=test_results.trx" Source\Tests\bin\Release\Tests.dll
      - name: Test Report
        uses: dorny/test-reporter@v1.6.0
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx 
