name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source/Terminals.sln

jobs:
  build:
    name: ${{ matrix.suite }} tests
    # Separate the file/general test runner from SQL LocalDB setup and deployments.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: file-and-general
            filter: 'FullyQualifiedName!~Tests.SqlPersisted&TestCategory!=Database'
          - suite: database
            filter: 'FullyQualifiedName~Tests.SqlPersisted|TestCategory=Database'

    steps:
      - uses: actions/checkout@v6
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3
      - name: Restore packages.config and PackageReference dependencies
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:Restore -property:RestorePackagesConfig=true -property:Configuration=Release
      - name: Ensure .NET Framework 4.8.1 targeting assemblies
        shell: pwsh
        run: |
          $destination = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8.1'
          if (-not (Test-Path (Join-Path $destination 'mscorlib.dll'))) {
            $packageDir = Join-Path $env:RUNNER_TEMP 'net481-reference'
            nuget install Microsoft.NETFramework.ReferenceAssemblies.net481 -Version 1.0.3 -Source https://api.nuget.org/v3/index.json -OutputDirectory $packageDir -ExcludeVersion -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw 'Failed to download .NET Framework 4.8.1 targeting assemblies' }
            $source = Join-Path $packageDir 'Microsoft.NETFramework.ReferenceAssemblies.net481/build/.NETFramework/v4.8.1'
            if (-not (Test-Path (Join-Path $source 'mscorlib.dll'))) { throw 'Missing 4.8.1 reference assemblies in package' }
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item (Join-Path $source '*') $destination -Recurse -Force
          }
      - name: Build solution
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:rebuild -property:Configuration=Release
      - name: Verify generated MSTSC COM wrappers
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'Build/Generated/Mstsc'
          foreach ($name in @('MSTSCLib.dll', 'AxInterop.MSTSCLib.dll')) {
            $path = Join-Path $dir $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Expected generated COM wrapper: $path" }
            Write-Host "Generated: $path"
          }
          if (Test-Path 'Resources/Libraries/mstsc/MSTSCLib.dll') { throw 'Vendored MSTSC wrapper still present' }
          if (Test-Path 'Resources/Libraries/mstsc/AxInterop.MSTSCLib.dll') { throw 'Vendored ActiveX wrapper still present' }
      - name: Locate VSTest in Visual Studio
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe is unavailable' }
          $installationPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $installationPath) { throw 'Visual Studio installation was not found' }
          $vstest = Join-Path $installationPath 'Common7/IDE/Extensions/TestPlatform/vstest.console.exe'
          if (-not (Test-Path -LiteralPath $vstest)) { throw "Missing VSTest executable at $vstest" }
          (Split-Path -Path $vstest -Parent) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using VSTest from: $vstest"
      - name: Install SQL Server LocalDB (database suite only)
        if: matrix.suite == 'database'
        uses: potatoqualitee/mssqlsuite@v1.7
        with:
          install: localdb
          show-log: true
      - name: Create SQL database from source schema (database suite only)
        if: matrix.suite == 'database'
        shell: pwsh
        run: ./Source/Tests/SqlPersisted/Initialize-LocalDb.ps1
      - name: Execute ${{ matrix.suite }} tests
        shell: pwsh
        env:
          TEST_FILTER: ${{ matrix.filter }}
          TERMINALS_TEST_SQL_CONNECTION_STRING: ${{ matrix.suite == 'database' && 'Data Source=(localdb)\MSSQLLocalDB;Initial Catalog=TERMINALS;Integrated Security=True;' || '' }}
        run: |
          $adapterRoot = Join-Path $env:USERPROFILE '.nuget/packages/mstest.testadapter/4.5.2'
          $adapter = Get-ChildItem -LiteralPath $adapterRoot -Filter MSTest.TestAdapter.dll -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]net462[\\/]' } | Select-Object -First 1
          if (-not $adapter) { throw "MSTest adapter for .NET Framework not found under $adapterRoot" }
          vstest.console.exe "Source\Tests\bin\Release\Tests.dll" "/TestAdapterPath:$($adapter.DirectoryName)" "/TestCaseFilter:$env:TEST_FILTER" '/logger:trx;LogFileName=test_results.trx'
          exit $LASTEXITCODE
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: ${{ matrix.suite }} MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx
