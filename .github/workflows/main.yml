name: CI

on:
  # Validate all branch pushes, but not tag pushes.
  push:
    branches: [ '**' ]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.mdown'
      - '**/*.rst'
      - 'Docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    # Fork PRs require validation in this repository; local pushes already run CI.
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.mdown'
      - '**/*.rst'
      - 'Docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  # Superseded PR commits cancel obsolete runs; master and manual runs remain independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SLN_FILE_PATH: Source/Terminals.sln
  MSTEST_VERSION: '4.5.3'
  VSTEST_VERSION: '18.10.1'
  NET481_REFERENCE_VERSION: '1.0.3'

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    name: ${{ matrix.suite }} tests
    # Separate the file/general test runner from SQL LocalDB setup and deployments.
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: file-and-general
            filter: 'FullyQualifiedName!~Tests.SqlPersisted&TestCategory!=Database&TestCategory!=RasAbi'
          - suite: database
            filter: 'FullyQualifiedName~Tests.SqlPersisted|TestCategory=Database'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate CI workflow and PowerShell syntax
        if: matrix.suite == 'file-and-general'
        timeout-minutes: 5
        shell: pwsh
        run: ./Build/Test-CiSyntax.ps1
      - name: Reject tracked build outputs and obsolete source-control bindings
        if: matrix.suite == 'file-and-general'
        shell: pwsh
        run: ./Build/Test-TrackedArtifacts.ps1
      - name: Validate WinForms Designer ownership
        if: matrix.suite == 'file-and-general'
        shell: pwsh
        run: ./Build/Test-WinFormsDesignerOwnership.ps1
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
      - name: Build Release solution
        shell: pwsh
        run: ./Build/Invoke-ReleaseBuild.ps1
      - name: Audit shared ZIP and Inno payload
        shell: pwsh
        run: ./Build/Assert-PackagePayload.ps1 -OutputDirectory ./Build/Output/Release
      - name: Verify generated MSTSC COM wrappers
        shell: pwsh
        run: ./Build/Test-MstscWrappers.ps1
      # The MSTest adapter requires a matching VSTest platform (currently pinned below).
      # The Visual Studio 2022 image includes the older VSTest 17.14, which
      # causes deployment-time CodePages assembly identity conflicts.
      - name: Install matching VSTest platform
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'Source/Tests/Tests.csproj' -Raw
          foreach ($name in @('MSTest.TestAdapter', 'MSTest.TestFramework')) {
            $reference = $project.SelectSingleNode("//*[local-name()='PackageReference' and @Include='$name']")
            if (-not $reference -or $reference.Version -ne $env:MSTEST_VERSION) { throw "Expected $name $env:MSTEST_VERSION" }
          }
          $packageDir = Join-Path $env:RUNNER_TEMP 'vstest-platform'
          nuget install Microsoft.TestPlatform -Version $env:VSTEST_VERSION -Source https://api.nuget.org/v3/index.json -OutputDirectory $packageDir -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Microsoft.TestPlatform $env:VSTEST_VERSION" }
          $vstest = Join-Path $packageDir 'Microsoft.TestPlatform/tools/net462/Common7/IDE/Extensions/TestPlatform/vstest.console.exe'
          if (-not (Test-Path -LiteralPath $vstest)) { throw "Missing .NET Framework VSTest: $vstest" }
          (Split-Path -Path $vstest -Parent) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using pinned VSTest from: $vstest"
          # The pinned executable prints its version when tests run. /version is not supported.
      - name: Validate test discovery partition
        if: matrix.suite == 'file-and-general'
        timeout-minutes: 10
        shell: pwsh
        run: ./Build/Test-DiscoveryPartition.ps1
      - name: Install SQL Server LocalDB (database suite only)
        timeout-minutes: 15
        if: matrix.suite == 'database'
        uses: potatoqualitee/mssqlsuite@9a0136e208df60b8ecb62909f076bc34854fa55a # v1.7
        with:
          install: localdb
          show-log: true
      - name: Create SQL database from source schema (database suite only)
        if: matrix.suite == 'database'
        shell: pwsh
        run: ./Source/Tests/SqlPersisted/Initialize-LocalDb.ps1
      - name: Execute ${{ matrix.suite }} tests
        id: standard-tests
        timeout-minutes: 20
        shell: pwsh
        env:
          TEST_FILTER: ${{ matrix.filter }}
          TERMINALS_TEST_SQL_CONNECTION_STRING: ${{ matrix.suite == 'database' && 'Data Source=(localdb)\MSSQLLocalDB;Initial Catalog=TERMINALS;Integrated Security=True;' || '' }}
        run: ./Build/Invoke-StandardTests.ps1
      - name: Validate RAS ABI on x86 and x64
        timeout-minutes: 10
        if: ${{ !cancelled() && matrix.suite == 'file-and-general' && steps.standard-tests.outcome != 'skipped' && steps.standard-tests.outcome != '' }}
        shell: pwsh
        run: ./Build/Test-RasAbi.ps1
      - name: Upload test diagnostic results
        if: ${{ !cancelled() && hashFiles('TestResults/*.trx') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminals-${{ matrix.suite }}-trx
          path: TestResults/*.trx
          if-no-files-found: error
      - name: Test Report
        id: test-report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: ${{ !cancelled() && hashFiles('TestResults/test_results.trx') != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        with:
          name: ${{ matrix.suite }} MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx
          fail-on-error: 'false'
      - name: Warn on test report publication failure
        if: ${{ !cancelled() && steps.test-report.outcome == 'failure' }}
        shell: pwsh
        run: Write-Output '::warning::Test report publication failed; consult the TRX artifacts and test execution outcome.'

  package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    name: Build and test Inno Setup and portable ZIP
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
      - name: Build Release solution
        shell: pwsh
        run: ./Build/Invoke-ReleaseBuild.ps1
      - name: Verify generated MSTSC COM wrappers
        shell: pwsh
        run: ./Build/Test-MstscWrappers.ps1
      - name: Verify packaging idempotency
        shell: pwsh
        run: ./Build/Test-PackagingIdempotency.ps1
      - name: Install verified Inno Setup 7.1.1 compiler
        timeout-minutes: 15
        shell: pwsh
        run: |
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $sha256 = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          Invoke-WebRequest -Uri $uri -OutFile $download
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { throw "Inno compiler SHA256 mismatch: $actual" }
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$directory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno compiler installer exited $($process.ExitCode)" }
          $compiler = Join-Path $directory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "ISCC missing: $compiler" }
          "INNO_ISCC_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile Inno Setup EXE
        shell: pwsh
        run: ./Build/Build-Inno.ps1
      - name: Validate Inno distribution and ZIP file integrity
        shell: pwsh
        run: ./Build/Assert-InnoDistribution.ps1
      - name: Silent install and uninstall smoke test
        timeout-minutes: 15
        shell: pwsh
        run: ./Build/Test-InnoInstall.ps1
      - name: Reject legacy MSI and portable-data collisions
        shell: pwsh
        run: ./Build/Test-InnoSafety.ps1
      - name: Upload installer diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminals-inno-logs
          path: Build/Output/InstallerLogs/*.log
          if-no-files-found: warn
      - name: Upload ZIP and Inno EXE
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminals-distribution
          path: |
            Build/Output/Terminals_v*.zip
            Build/Output/TerminalsSetup_*.exe
          if-no-files-found: error
